<div class="chat-page">

  <header class="top-bar">
    <img src="/fabulari-logo.png" alt="Fabulari" class="nav-logo">

    <nav>
      <a routerLink="/home">Home</a>
      <span>|</span>
      <a routerLink="/profile">Profile</a>
      <span>|</span>
      <a href="#" (click)="session.logout(); $event.preventDefault()">Logout</a>
    </nav>
  </header>

  <div class="chat-layout">

    <aside class="rooms">
      <app-leave-group #membership groupName="Study" />
      <app-group-settings [groupId]="membership.selectedId()" />

      <app-group-members [groupId]="membership.selectedId()" />
    </aside>

  </div>
</div>
