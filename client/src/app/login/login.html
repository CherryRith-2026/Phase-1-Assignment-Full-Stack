<div class="login-page">

   <header class="top-bar">
    <img src="/fabulari-logo.png" alt="Fabulari" class="top-logo">
  </header>

  <main class="login-container">

    <div class="logo">
      <img src="/fabulari-logo.png" alt="Fabulari" class="main-logo">
    </div>

    <h2>Login</h2>

<!-- ngSubmit calls login() function when the login form is submitted -->

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Username:</label>
        
         <!-- ngModel connects the input to the username variable in login.ts -->
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Username"
          [(ngModel)]="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Password:</label>

       <!-- ngModel connects the input to password in login.ts -->
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          [(ngModel)]="password"
        >
      </div>

      <button type="submit">Submit</button>
    </form>

    <p class="signup-link">
      Don't have an account?
      <a routerLink="/signup">Sign up</a>
    </p>

  </main>

</div>
