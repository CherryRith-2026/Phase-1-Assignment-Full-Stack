<div class="chat-page">

  <header class="top-bar">
    <h1>Fabulari</h1>

    <nav>
      <a routerLink="/home">Home</a>
      <span>|</span>
      <a routerLink="/profile">Profile</a>
      <span>|</span>
      <a routerLink="/login">Logout</a>
    </nav>
  </header>

  <div class="chat-layout">

    <aside class="rooms">
      <h3>Chat Rooms</h3>

      <button>General</button>
      <button>Music Talk</button>
      <button>Song Recommendations</button>
    </aside>

    <main class="chat">
      <h2>General</h2>

      <div class="messages">

        <div class="message">
          <strong>Cherry</strong>
          <p>What songs are you guys listening to?</p>
        </div>

        <div class="message">
          <strong>James</strong>
          <p>I've been listening to jazz and pop lately!</p>
        </div>

        <p class="notification">
          Sarah joined the room.
        </p>

        <div class="message">
          <strong>Sarah</strong>
          <p>Any song recommendations?</p>
        </div>

      </div>

      <div class="message-input">
        <input
          type="text"
          placeholder="Type a message..."
        >

        <button>Image</button>
        <button>Send</button>
      </div>
    </main>

    <aside class="active-users">
      <h3>Active Users</h3>

      <p>Cherry</p>
      <p>James</p>
      <p>Sarah</p>
    </aside>

  </div>

</div>
