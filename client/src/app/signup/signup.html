<div class="signup-page">

  <header class="top-bar">
    <img src="/fabulari-logo.png" alt="Fabulari" class="top-logo">
  </header>

  <main class="signup-container">

    <div class="logo">
      <img src="/fabulari-logo.png" alt="Fabulari" class="main-logo">
    </div>

    <h2>Sign-up</h2>
    <!-- RouterLink help the user to navigate bavk to login page -->
    <p class="login-link">
      Already registered?
      <a routerLink="/login">Log in here.</a>
    </p>

    <!-- Sign-up form will gather the new user's information to create new user -->
    
<form (ngSubmit)="signup()">   <!-- ngSubmit calls signup() when the form is submitted -->

  <div class="form-group">
    <label for="username">Username:</label>
    <input
      type="text"
      id="username"
      name="username"
      [(ngModel)]="username"
    >
  </div>

  <div class="form-group">
    <label for="firstName">First name:</label>
    <input
      type="text"
      id="firstName"
      name="firstName"
      [(ngModel)]="firstName"
    >
  </div>

  <div class="form-group">
    <label for="lastName">Last name:</label>
    <input
      type="text"
      id="lastName"
      name="lastName"
      [(ngModel)]="lastName"
    >
  </div>

  <div class="form-group">
    <label for="email">Email Address:</label>
    <input
      type="email"
      id="email"
      name="email"
      [(ngModel)]="email"
    >
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="password"
    >
  </div>

  <div class="form-group">
    <label for="dob">Date of Birth:</label>
    <input
      type="date"
      id="dob"
      name="dob"
      [(ngModel)]="dob"
    >
  </div>

  <button type="submit">Submit</button>

</form>

  </main>
</div>
